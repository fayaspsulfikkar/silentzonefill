version: "3.9"

services:
  silentzone:
    build: .
    container_name: silentzone-bot
    restart: unless-stopped
    # Bind strictly to localhost so port 8000 is NOT exposed publicly on EC2
    ports:
      - "127.0.0.1:8000:8000"
    shm_size: "1gb"
    volumes:
      - ./data:/app/data            # SQLite database (persistent across restarts)
      - ./screenshots:/app/screenshots  # Diagnostic screenshots (persistent)
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
